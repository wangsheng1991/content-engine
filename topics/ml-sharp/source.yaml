slug: ml-sharp
title: "SHARP：单张图的秒级 3D 高斯视图合成"
subtitle: "Apple 用单次前馈把一张照片读成可实时渲染的 metric 3D 高斯场景。"
kind: research
date: 2026-09-21
updated: 2026-09-21
status: published
summary: |
  SHARP 是 Apple 提出的单目视图合成方法：给定一张照片，它在单次前馈中回归出场景的 3D 高斯表示，标准 GPU 上耗时不到 1 秒。得到的 3DGS 可以被实时渲染，输出附近视角的高分辨率写实图像，而且表示是 metric 的，带绝对尺度，支持米制相机运动。
  按 README 与论文摘要，它在多个数据集上把 LPIPS 降低 25–34%、DISTS 降低 21–43%，同时把合成耗时降低三个数量级。
  对开发者来说，值得看的是它把「重建」压缩成了一次前馈调用，并且给出了现成的 CLI 与权重。
