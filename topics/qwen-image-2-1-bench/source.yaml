slug: qwen-image-2-1-bench
title: "Qwen-Image-2.1 实测：7 题过 4 题，差距大半在口径上"
subtitle: "三家图像模型、同一台机器、同一份公开题面，全部用原题面同 seed。首轮 7 题只过 4 题 —— 而只把题面改成长描述，两道失败题当场都过了。"
title_en: "Qwen-Image-2.1 on public prompts: the 4/7 was protocol, not capability"
subtitle_en: "Three image models, one machine, one public prompt set, verbatim and same-seed. Rewriting the prompts into enhancer-style descriptions fixed both failures on the spot."
kind: practice
date: 2026-09-22
updated: 2026-09-22
status: published
summary: |
  把 Qwen-Image-2.1、SenseNova-U1.5 和一个 4 步 INT4 的 FLUX.2-klein 放在同一台机器、同一张卡上，
  用 GenEval / DPG-Bench / LongText-Bench 的原题面逐题对打：Qwen 的组合题只有 4/7，另两家 7/7。
  但官方推荐的管线是「提示词增强 + 2048² + 40 步」，我们首轮三样一样没占。只把题面改写成增强器风格的长描述，
  同分辨率、同 seed，两道丢物体的题当场都过了 —— 这类失败是短请求不吃，不是不会画。
  另外做了一套 26 道自建垂直题（9 个领域、156 张出图），回答「这个活到底该用哪个模型」：
  九个领域里没有通吃的，SenseNova 拿下效果图、人像、UI 稿、漫画分镜，Qwen 独占中文海报大标题与原生透明 RGBA。
summary_en: |
  Qwen-Image-2.1, SenseNova-U1.5 and a 4-step INT4 FLUX.2-klein, on one machine and one GPU, run
  against the verbatim text of GenEval / DPG-Bench / LongText-Bench, same seed: Qwen passed 4 of 7
  compositional prompts where both baselines went 7/7. But the recommended pipeline is prompt
  rewriter + 2048² + 40 steps, and round one used none of them. Rewriting the prompts into
  enhancer-style descriptions — same resolution, same seed — fixed both object-dropping failures on
  the spot. These are prompts the model does not eat, not pictures it cannot draw.
  A second, self-authored set of 26 vertical prompts (9 domains, 156 images) answers "which model
  should take this job": no single model wins everywhere. SenseNova takes renders, portraits, UI
  mockups and comic panels; Qwen owns the Chinese poster headline and native transparent RGBA.
