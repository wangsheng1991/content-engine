slug: passport-photo
title: "证件照规格表：每个数字都带着它出自哪句话"
subtitle: "俄罗斯 3 × 4 与 35 × 45 两行规格，每个数字后面挂着来源原句。一个与另外三处矛盾的数字没有被删掉，留在表里写明为什么落选；只有单一来源的那一行，不上线。工具本身不联网 —— 照片不进任何服务器。"
title_en: "An ID photo spec table where every number carries the sentence it came from"
subtitle_en: "Two verified Russian formats, each number carrying a verbatim quotation from its source. One conflicting figure was kept in the table instead of deleted, with the reason it lost. One row is deliberately not shipped, because only one page describes it. And the photo never leaves the browser."
kind: practice
date: 2026-09-24
updated: 2026-09-24
status: published
summary: |
  办证照片的规格是一堆毫米数字，散在政府页面、照相馆说明和签证代办站之间互相抄。
  这份做法的核心只有一条：每个数字都必须和它出现的那句话绑在一起，读不到原句的数字不进表。
  俄罗斯两行最常用的规格（3 × 4 与 35 × 45）由此定下来，每个数字都能被陌生人重新核一遍。
  一个来源把头部高度写成 11–13 mm，与另外三处矛盾 —— 它没有被删掉，而是留在表里写清为什么落选。
  另一种只被一页描述过的规格则干脆不上线：**一个来源不算证据。**
  工具本身不联网，照片用 canvas 在浏览器里裁完直接导出，服务器收不到。
summary_en: |
  ID photo specs are a pile of millimetre figures copied between government pages, studio
  instructions and visa agencies. The rule here is single: every number is bound to the sentence it
  appeared in, and a number whose sentence cannot be read does not enter the table. That is how two
  Russian formats (3 × 4 and 35 × 45) were pinned down, re-checkable by a stranger months later.
  One source put the head height at 11–13 mm against three others — it was kept in the table with the
  reason it lost rather than quietly deleted. Another format described by exactly one page is not
  shipped at all: one source is not evidence. The photo itself never leaves the browser.
