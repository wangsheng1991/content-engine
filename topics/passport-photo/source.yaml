key_facts:
  - label: 表里的一行是什么
    value: "一个证件规格 = 尺寸(mm) + 头部高度区间 + 头顶留白区间 + 背景色 + 最低 DPI + 可排版纸张 + 状态 + 来源原句"
  - label: 俄罗斯 3 × 4 cm
    value: "30 × 40 mm，头高 26 mm，头顶留白 2–4 mm，白底，≥ 600 dpi"
  - label: 俄罗斯护照 35 × 45 mm
    value: "35 × 45 mm，头高 32–36 mm（占高度 70–80%），头顶留白 4–6 mm，白底，≥ 300 dpi"
  - label: 被否决的数字
    value: "有来源把 3 × 4 的头高写成 11–13 mm —— 与另外三处矛盾，否决后仍留在表里并写明理由"
  - label: 不上线的那一行
    value: "新版申请表用的另一种 35 × 45（头高 25–30 mm）只有一个来源，状态标记为 single-source，不进线上页面"
  - label: 照片去哪了
    value: "哪都没去 —— FileReader 进 canvas，toBlob 直接下载，页面里没有一处上传"
