slug: wan-i2v-first-frame
title: "把一张效果图变成 5 秒镜头：万相图生视频的三个账单陷阱"
subtitle: "wan2.6-i2v-flash 只需要一张首帧图和一个运动提示词，但它的两个参数默认值都不是便宜的那个。"
kind: practice
date: 2026-09-22
updated: 2026-09-22
status: published
summary: |
  通义万相（wan2.6-i2v-flash）是图生视频里最省事的一档：一张首帧图 + 一句运动提示词，五秒后拿到一段 MP4。
  它只有异步接口，必须显式打开异步提交，再用任务 ID 轮询，结果链接 24 小时过期。
  真正容易吃亏的是另外两个参数：resolution 是「像素预算」而不是分辨率档位（默认还是更贵的 1080P），
  audio 默认是开着的 —— 不写它，一条 5 秒 720P 的片子就按有声价计费，正好贵一倍（¥1.50 而不是 ¥0.75）。
  我们六月份那批三条片子就是这样付的：文件里都带着 AAC 音轨，因为脚本当时没传 audio。
